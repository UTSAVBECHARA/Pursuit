[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pursuit"
description = "An AI-powered job discovery, intelligent candidate-job matching, and automated job application platform."
readme = "README.md"
keywords = ["jobs", "job-search", "resume", "job-applications", "browser-automation", "ai-agent", "llm"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dynamic = ["version"]
# invisible-playwright-mcp is never pinned: an install takes its newest release.
dependencies = [
    "click>=8.1",
    "cryptography>=42",
    "duckdb>=1.1",
    "invisible-playwright-mcp",
    "mcp>=1.9",
    "openai>=1.40",
    "pypdf>=4",
    "pyyaml>=6",
    "rich>=13",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyarrow>=15"]  # pyarrow: the pipeline writes description files with it

[project.scripts]
pursuit = "aihawk.cli:run"
aihawk = "aihawk.cli:run"

[project.urls]
Homepage = "https://github.com/UTSAVBECHARA/Pursuit"
Issues = "https://github.com/UTSAVBECHARA/Pursuit/issues"
Changelog = "https://github.com/UTSAVBECHARA/Pursuit/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/aihawk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aihawk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "browser: runs the real invisible-playwright-mcp and its Firefox",
]

[tool.ruff]
line-length = 160
src = ["src", "tests", "app", "api"]

[tool.ruff.lint]
ignore = ["EXE001"]
